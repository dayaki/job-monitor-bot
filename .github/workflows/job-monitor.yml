# .github/workflows/job-monitor.yml
# GitHub Actions Workflow for Job Monitoring Bot

name: Job Monitor Bot

on:
  schedule:
    # Run every 4 hours at minute 0 (00:00, 04:00, 08:00, etc.)
    # With combined-site Serper queries, this is also the worst-case alert latency.
    - cron: "0 */4 * * *"

  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: job-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Dedup state (the "seen" job IDs) lives in the Actions cache, not the repo — so the
      # bot no longer commits seen_jobs.json on every run. Restore the most recent cache via
      # the restore-keys prefix; save under a unique per-run key (cache keys are immutable).
      - name: Restore seen jobs
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Ensure seen_jobs.json exists
        run: '[ -f seen_jobs.json ] || echo "{}" > seen_jobs.json'

      - name: Run job search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python job_monitor.py

      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}

# ---------------------------------------------------------------------------
# Alternative schedules (replace the cron above):
#   every 2h: '0 */2 * * *'   every 6h: '0 */6 * * *'   daily 9am UTC: '0 9 * * *'
# If you change the interval, update notifications.heartbeat_hour_utc in
# sites_config.yaml to an hour the schedule actually runs.
