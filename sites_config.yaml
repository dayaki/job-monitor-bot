# Job Monitor runtime configuration: result filtering, notifications, and HTTP tuning.
# (What the bot searches for is configured in google_search_sites.yaml — the Serper search.)

# Location filtering for final alert eligibility.
location_filter:
  location_filter_mode: "strict_remote_with_exception"
  # Accept results whose title/snippet never mentions location. The search query already
  # enforces "remote -onsite -hybrid", so an unspecified snippet is almost always remote.
  # Set false to revert to rejecting anything not explicitly stated remote.
  accept_unspecified_location: true
  location_remote_terms:
    - "remote"
    - "work from home"
    - "wfh"
    - "distributed"
    - "anywhere"
  location_hybrid_terms:
    - "hybrid"
    - "2 days onsite"
    - "3 days onsite"
    - "partially remote"
  location_onsite_terms:
    - "onsite"
    - "on-site"
    - "in office"
    - "office based"
    - "on site"
  location_exception_terms:
    - "visa sponsorship"
    - "sponsorship available"
    - "relocation support"
    - "willing to relocate"
    - "relocation assistance"

# Heartbeat / failure alerts so silence means "no new jobs", not "the bot broke".
notifications:
  # Send a Telegram alert when the run has problems (search failures, rate-limit/quota,
  # zero queries executed, or a missing SERPER_API_KEY).
  alert_on_failures: true
  # Send a daily "still alive" status summary even when there are 0 new jobs.
  heartbeat_enabled: true
  # Which run hour (UTC) sends the daily heartbeat. The workflow runs every 4h
  # (00,04,08,12,16,20), so this must be one of those hours to fire on schedule.
  heartbeat_hour_utc: 8

# Global runtime tuning for HTTP behavior and seen-jobs retention.
request:
  timeout: 15
  max_retries: 3
  retry_base_delay: 1.0
  retry_max_delay: 10.0
  concurrent_limit: 10
  per_domain_min_interval: 0.2
  seen_jobs_max: 5000
  seen_jobs_ttl_days: 90
  telegram_max_retries: 3
  telegram_retry_base_delay: 1.0
  telegram_retry_max_delay: 10.0
